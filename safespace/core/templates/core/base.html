<!-- templates/base.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>
        {% block title %}SafeSpace{% endblock %}
    </title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 1. Browser normalization defaults -->
  <link rel="stylesheet" href="{% static 'css/normalize.css' %}?v={{ ts }}">
  <link rel="stylesheet" href="{% static 'css/skeleton.css' %}?v={{ ts }}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v={{ ts }}">
</head>

<body>

    <!-- Header & Branded Navigation Bar -->
    <header class="site-header">
        <div class="container">
            <a href="{% url 'home' %}" class="brand">
                <span class="brand__title">SafeSpace</span>
            </a>

            <nav class="nav">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'quest_list' %}">Quests</a>
                <a href="{% url 'user_list' %}">Users</a>
                <a href="{% url 'reward_list' %}">Rewards</a>
                <a href="{% url 'forum_nearby_page' %}">Forums Nearby</a>
                <a href="{% url 'register' %}">Register</a>
            </nav>
        </div>
    </header>

    <hr class="hr">

    <!-- Main Content Area -->
    <main class="container section">
        {% block content %}
            <p class="muted">This is default content.</p>
        {% endblock %}
    </main>

</body>
</html>
