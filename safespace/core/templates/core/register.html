{% extends "core/base.html" %}
{% load socialaccount %}

{% block title %}
    Register
{% endblock %}

{% block content %}

<h1>Sign up</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign up</button>

    <div class="d-grid">
      <a href="{% provider_login_url 'google' %}"
         class="google-btn text-decoration-none text-center">
         <img src="https://developers.google.com/identity/images/g-logo.png"
              alt="Google Logo"
              class="google-icon">
         Continue with Google
      </a>
    </div>

</form>

<p class="muted">
    Already have an account? <a href="{% url 'login' %}">Log in</a>.
</p>

<script>
    // Pressing Back can show this page from the browser's memory without
    // asking the server. Reload so a logged-in user is sent home instead.
    window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
            window.location.reload();
        }
    });
</script>

{% endblock %}
