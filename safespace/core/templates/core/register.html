{% extends "core/base.html" %}
{% load socialaccount %}

{% block title %}
    Register
{% endblock %}

{% block content %}

<section class="auth-card">

    <h1>Join SafeSpace</h1>
    <p class="muted">Create an account to start your first quest.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="auth-submit">Sign up</button>
    </form>

    <p class="auth-divider"><span>or</span></p>

    <a href="{% provider_login_url 'google' %}" class="google-btn">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="" class="google-icon">
        Continue with Google
    </a>

    <p class="auth-switch muted">
        Already have an account? <a href="{% url 'login' %}">Log in</a>
    </p>

</section>

<script>
    // Pressing Back can show this page from the browser's memory without
    // asking the server. Reload so a logged-in user is sent home instead.
    window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
            window.location.reload();
        }
    });
</script>

{% endblock %}
