{% extends "core/base.html" %}

{% block title %}
    Register
{% endblock %}

{% block content %}

<h1>Sign up</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign up</button>
</form>

<p class="muted">
    Already have an account? <a href="{% url 'login' %}">Log in</a>.
</p>

{% endblock %}
