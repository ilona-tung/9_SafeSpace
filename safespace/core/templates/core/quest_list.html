{% extends "core/base.html" %}

{% block title %}
    Quests
{% endblock %}

{% block content %}

<h1>Quests</h1>

<ul>
    {% for quest in quests %}
        <li>
            <a href="{{ quest.get_absolute_url }}">
                {{ quest.title }}
            </a>
        </li>
    {% empty %}
        <li>No quests yet!</li>
    {% endfor %}
</ul>

{% endblock %}
