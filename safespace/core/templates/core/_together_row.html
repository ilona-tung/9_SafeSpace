{# One Together quest done by `user` and `other` #}
<li class="together-item">
    <span>
        <a href="{{ invite.quest.get_absolute_url }}"><strong>{{ invite.quest.title }}</strong></a>
        with <a href="{% url 'profile_view' other.username %}">{{ other.username }}</a>
    </span>
    <span class="muted">✓ {{ invite.accepted_at|date:"M j, Y" }}</span>
</li>
