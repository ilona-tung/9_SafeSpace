{% extends "core/base.html" %}
{% load socialaccount %}

{% block title %}
    Log in
{% endblock %}

{% block content %}

<h1>Log in</h1>

<form method="POST" class="card p-4 shadow-sm">

  {% csrf_token %}

  {{ form.as_p }}

  <div class="d-grid mt-3">
    <button type="submit" class="btn btn-primary">
      Login
    </button>
  </div>

  <!-- Divider -->
  <div class="text-center my-3">
    <span class="text-muted">OR</span>
  </div>

  <!-- Google Login Button -->
  <div class="d-grid">
    <a href="{% provider_login_url 'google' %}"
       class="google-btn text-decoration-none text-center">
       <img src="https://developers.google.com/identity/images/g-logo.png"
            alt="Google Logo"
            class="google-icon">
       Sign in with Google
    </a>
  </div>

</form>

<p class="muted">
    New here? <a href="{% url 'register' %}">Create an account</a>.
</p>

<script>
    // Pressing Back can show this page from the browser's memory without
    // asking the server. Reload so a logged-in user is sent home instead.
    window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
            window.location.reload();
        }
    });
</script>

{% endblock %}
