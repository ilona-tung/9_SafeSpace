{% extends "core/base.html" %}

{% block title %}
    Log in
{% endblock %}

{% block content %}

<h1>Log in</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
</form>

<p class="muted">
    New here? <a href="{% url 'register' %}">Create an account</a>.
</p>

<script>
    // Pressing Back can show this page from the browser's memory without
    // asking the server. Reload so a logged-in user is sent home instead.
    window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
            window.location.reload();
        }
    });
</script>

{% endblock %}
