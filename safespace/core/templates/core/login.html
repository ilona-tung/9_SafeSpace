{% extends "core/base.html" %}
{% load socialaccount %}

{% block title %}
    Log in
{% endblock %}

{% block content %}

<section class="auth-card">

    <h1>Welcome back</h1>
    <p class="muted">Log in to continue your quests and journal.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="auth-submit">Log in</button>
    </form>

    <p class="auth-divider"><span>or</span></p>

    <a href="{% provider_login_url 'google' %}" class="google-btn">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="" class="google-icon">
        Sign in with Google
    </a>

    <p class="auth-switch muted">
        New here? <a href="{% url 'register' %}">Create an account</a>
    </p>

</section>

<script>
    // Pressing Back can show this page from the browser's memory without
    // asking the server. Reload so a logged-in user is sent home instead.
    window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
            window.location.reload();
        }
    });
</script>

{% endblock %}
